<body class="admin admin--entrada" data-pagina="login">
<main class="entrada-equipa">
  <div class="entrada-equipa__cartao">
    <a class="marca marca--clara" href="/" aria-label="Implement — site">
      <svg class="abelha abelha--lilas" aria-hidden="true"><use href="/assets/img/sprite.svg#abelha"/></svg>
      <span class="marca__texto"><span class="marca__nome">implement</span><span class="marca__sub">Digital Marketing</span></span>
    </a>
    <h1>Área da equipa</h1>
    <p class="entrada-equipa__intro">Escreva e publique os artigos do blog da Implement.</p>
      <form class="entrada-equipa__forma" id="forma" novalidate>
        <label class="campo__rotulo" for="email">E-mail da equipa</label>
        <input class="entrada" id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="nome@heyimplement.com" required>
        <button class="botao" type="submit" id="enviar"><span>Enviar link de acesso</span><svg class="seta" aria-hidden="true"><use href="/assets/img/sprite.svg#seta"/></svg></button>
        <p class="entrada-equipa__estado" id="estado" role="status" aria-live="polite"></p>
      </form>
      <p class="entrada-equipa__nota">Só e-mails <strong>@heyimplement.com</strong>. Enviamos um link que funciona uma vez, durante 15 minutos. Não há palavras-passe.</p>
  </div>
</main>
